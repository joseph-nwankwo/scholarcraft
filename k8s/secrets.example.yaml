# IMPORTANT: This is an EXAMPLE ONLY. Never commit real secrets to git.
# Create actual secrets via:
#   kubectl create secret generic lecturecraft-secrets \
#     --namespace lecturecraft \
#     --from-literal=DATABASE_URL="postgresql://..." \
#     --from-literal=REDIS_URL="redis://..." \
#     ... etc
#
# Or use a secrets manager: AWS Secrets Manager, Vault, Sealed Secrets, etc.

