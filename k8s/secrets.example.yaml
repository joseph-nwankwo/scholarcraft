  JWT_REFRESH_SECRET: "change-me-at-least-32-chars-long-secret"
  COOKIE_SECRET: "change-me-at-least-32-chars-long-secret"
  OPENAI_API_KEY: "sk-..."
  ANTHROPIC_API_KEY: "sk-ant-..."
  GOOGLE_AI_API_KEY: "AIza..."
  STRIPE_SECRET_KEY: "sk_live_..."
  STRIPE_WEBHOOK_SECRET: "whsec_..."
  AWS_ACCESS_KEY_ID: "AKIA..."
