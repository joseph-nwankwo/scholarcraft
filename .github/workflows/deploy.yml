name: Deploy

on:
  workflow_run:
    workflows: ['Docker Build & Push']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}

jobs:
  # ── Deploy to Staging ─────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    environment: staging
    if: |
      (github.event.workflow_run.conclusion == 'success' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/lecturecraft

            # Pull latest images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull backend frontend

            # Run database migrations
            docker compose -f docker-compose.prod.yml run --rm backend \
              sh -c "npx prisma migrate deploy"

            # Rolling restart (zero-downtime)
            docker compose -f docker-compose.prod.yml up -d --no-deps \
              --scale backend=2 backend
            sleep 10
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend

            # Health check
            sleep 15
            curl -f https://staging.lecturecraft.app/health || exit 1

            echo "✅ Staging deployment complete"

  # ── Deploy to Production ──────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-staging
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'production'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/lecturecraft

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Create timestamped backup before deploying
            ./scripts/backup.sh

            # Pull new images
            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f docker-compose.prod.yml pull backend frontend

            # Migrate DB
            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f docker-compose.prod.yml run --rm backend \
              sh -c "npx prisma migrate deploy"

            # Blue-green-style rolling restart
            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f docker-compose.prod.yml up -d --no-deps \
              --scale backend=2 backend
            sleep 20
            IMAGE_TAG=${{ env.IMAGE_TAG }} docker compose -f docker-compose.prod.yml up -d --no-deps frontend

            # Verify health
            sleep 15
            curl -f https://lecturecraft.app/health || (docker compose -f docker-compose.prod.yml rollback && exit 1)

            echo "✅ Production deployment complete"

      - name: Notify on success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: good
          SLACK_MESSAGE: ':rocket: LectureCraft production deployed successfully — tag `${{ env.IMAGE_TAG }}`'

      - name: Notify on failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_MESSAGE: ':x: LectureCraft production deployment FAILED'
